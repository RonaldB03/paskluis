name: paskluis_v1
description: "PasKluis - pasjes, QR-codes en cadeaukaarten lokaal bewaren."
publish_to: 'none'

version: 1.0.0+16

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  barcode_widget: ^2.0.4
  wakelock_plus: ^1.1.4
  screen_brightness: ^2.1.7
  hive_ce: ^2.15.0
  hive_ce_flutter: ^2.3.4
  local_auth: ^2.2.0
  flutter_secure_storage: ^10.0.0
  mobile_scanner: ^7.2.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logos/