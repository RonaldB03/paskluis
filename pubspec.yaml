name: paskluis_v1
description: "PasKluis - pasjes, QR-codes en cadeaukaarten lokaal bewaren."
publish_to: 'none'

version: 1.3.4+36

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  barcode_widget: ^2.0.4
  wakelock_plus: ^1.1.4
  screen_brightness: ^2.1.7
  hive_ce: ^2.15.0
  hive_ce_flutter: ^2.3.4
  local_auth: ^2.2.0
  flutter_secure_storage: ^10.0.0
  mobile_scanner: ^7.2.0
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.17.1
  qr_flutter: ^4.1.0
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.17.2
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
