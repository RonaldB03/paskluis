# Workers use a server-only secret; user actions validate JWTs through Auth.
# Guest location lookups retain the gateway's public app-key check.
[functions.dispatch-notifications]
verify_jwt = false
[functions.delete-account]
verify_jwt = false
[functions.verify-purchase]
verify_jwt = false
[functions.send-shared-card-notification]
verify_jwt = false
[functions.nearest-brand-stores]
verify_jwt = true
[functions.support-attachments]
verify_jwt = false
[functions.reconcile-purchases]
verify_jwt = false

# Validates the caller with Auth and checks the active session in backup_service.
[functions.card-backups]
verify_jwt = false
