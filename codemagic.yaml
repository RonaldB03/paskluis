workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60

    integrations:
      app_store_connect: Codemagic

    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: nl.paskluis.app

    scripts:
      - name: Dependencies installeren
        script: flutter pub get
      - name: Broncode controleren
        script: flutter analyze
      - name: Tests uitvoeren
        script: |
          if [ -d test ]; then
            flutter test
          else
            echo "Nog geen testmap aanwezig; stap overgeslagen."
          fi
      - name: iOS-app bouwen
        script: flutter build ipa --release --export-options-plist=$CM_EXPORT_OPTIONS_PLIST

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
