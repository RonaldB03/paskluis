workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60

    integrations:
      app_store_connect: Codemagic

    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: nl.paskluis.app

    scripts:
      - name: Dependencies installeren
        script: flutter pub get
      - name: Broncode controleren
        script: flutter analyze --no-fatal-infos
      - name: Tests uitvoeren
        script: |
          if [ -d test ]; then
            flutter test
          else
            echo "Nog geen testmap aanwezig; stap overgeslagen."
          fi
      - name: iOS-code signing aan Xcode koppelen
        script: xcode-project use-profiles
      - name: iOS-app bouwen
        script: flutter build ipa --release --export-options-plist=$HOME/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration

  android-test:
    name: Android Test Build
    max_build_duration: 60

    environment:
      flutter: stable
      android_signing:
        - paskluis_upload

    scripts:
      - name: Dependencies installeren
        script: flutter pub get
      - name: Broncode controleren
        script: flutter analyze --no-fatal-infos
      - name: Tests uitvoeren
        script: |
          if [ -d test ]; then
            flutter test
          else
            echo "Nog geen testmap aanwezig; stap overgeslagen."
          fi
      - name: Android App Bundle bouwen
        script: flutter build appbundle --release
      - name: Android test-APK bouwen
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*.apk
