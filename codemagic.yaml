# PasKluis build trigger 2026-09-19: QR support for loyalty and gift cards
workflows:
  ios-release: &ios_release
    name: iOS Release Build
    max_build_duration: 60

    integrations:
      app_store_connect: Codemagic

    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: nl.paskluis.app

    scripts:
      - name: Dependencies installeren
        script: flutter pub get
      - name: Broncode controleren
        script: |
          set -e
          flutter analyze --no-fatal-infos --no-fatal-warnings
          echo "Broncodecontrole voltooid."
      - name: Tests uitvoeren
        script: |
          if [ -d test ]; then
            flutter test
          else
            echo "Nog geen testmap aanwezig; stap overgeslagen."
          fi
      - name: iOS-code signing aan Xcode koppelen
        script: xcode-project use-profiles
      - name: iOS-app bouwen
        script: |
          IOS_BUILD_NUMBER=$((BUILD_NUMBER + 33))
          echo "iOS-buildnummer: $IOS_BUILD_NUMBER"
          flutter build ipa --release --build-number="$IOS_BUILD_NUMBER" --export-options-plist=$HOME/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Paskluis Testers
        submit_to_app_store: false

  android-test: &android_test
    name: Android Test Build
    max_build_duration: 60

    environment:
      groups:
        - google_play_credentials
      flutter: stable
      android_signing:
        - paskluis_upload

    scripts:
      - name: Dependencies installeren
        script: flutter pub get
      - name: Broncode controleren
        script: |
          set -e
          flutter analyze --no-fatal-infos --no-fatal-warnings
          echo "Broncodecontrole voltooid."
      - name: Tests uitvoeren
        script: |
          if [ -d test ]; then
            flutter test
          else
            echo "Nog geen testmap aanwezig; stap overgeslagen."
          fi
      - name: Volgende Google Play-buildnummer bepalen
        script: |
          set -e
          LATEST_BUILD_NUMBER=$(google-play get-latest-build-number --package-name nl.paskluis.app)
          if [ -z "$LATEST_BUILD_NUMBER" ]; then
            echo "Geen bestaand buildnummer gevonden in Google Play."
            exit 1
          fi
          NEXT_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          echo "Laatste Google Play-buildnummer: $LATEST_BUILD_NUMBER"
          echo "Nieuw buildnummer: $NEXT_BUILD_NUMBER"
          echo "$NEXT_BUILD_NUMBER" > "$CM_BUILD_DIR/android_build_number.txt"
      - name: Android App Bundle bouwen
        script: |
          NEXT_BUILD_NUMBER=$(cat "$CM_BUILD_DIR/android_build_number.txt")
          flutter build appbundle --release --build-number="$NEXT_BUILD_NUMBER"
      - name: Android test-APK bouwen
        script: |
          NEXT_BUILD_NUMBER=$(cat "$CM_BUILD_DIR/android_build_number.txt")
          flutter build apk --release --build-number="$NEXT_BUILD_NUMBER"

    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*.apk

    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: alpha

  release-validation:
    name: Live test validation
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Dependencies and translations
        script: |
          flutter pub get
          flutter gen-l10n
      - name: Analyze release sources
        script: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run regression tests
        script: flutter test --reporter expanded

  # Candidate builds compile and test without distributing an app that requires
  # backend changes which are not yet deployed. Use the existing release
  # workflows once the deployment checklist is signed off.
  ios-candidate:
    <<: *ios_release
    name: iOS Candidate Build
    publishing: {}
  android-candidate:
    <<: *android_test
    name: Android Candidate Build
    publishing: {}
