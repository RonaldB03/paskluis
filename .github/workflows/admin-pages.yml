name: PasKluis Beheer publiceren

on:
  push:
    branches:
      - codex/paskluis-plus-foundation
    paths:
      - 'admin/**'
      - '.github/workflows/admin-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Broncode ophalen
        uses: actions/checkout@v4

      - name: GitHub Pages instellen
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Beheerportaal uploaden
        uses: actions/upload-pages-artifact@v3
        with:
          path: admin

      - name: Publiceren
        id: deployment
        uses: actions/deploy-pages@v4
