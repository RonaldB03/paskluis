name: PasKluis Beheer publiceren

on:
  push:
    branches:
      - codex/admin-control-center
    paths:
      - 'admin/**'
      - '.github/workflows/admin-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Broncode ophalen
        uses: actions/checkout@v4

      - name: GitHub Pages instellen
        uses: actions/configure-pages@v5

      - name: Beheerportaal uploaden
        uses: actions/upload-pages-artifact@v3
        with:
          path: admin

      - name: Publiceren
        uses: actions/deploy-pages@v4
