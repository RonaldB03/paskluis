name: Render Wear OS test-store screenshots
# Verify Play review requirements, all three categories and round branding.
on:
  push:
    branches: ['codex/smartwatch-beta', 'codex/wear-review-fixes']
    paths: ['.github/workflows/watch-store-preview.yml', 'android/wear/src/androidTest/**']
permissions:
  contents: read
jobs:
  wear-preview:
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 30
            arch: x86
          - api: 35
            arch: x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Prepare synthetic screenshots
        run: |
          git clone --depth 1 --branch 3.47.6 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          export PATH="$RUNNER_TEMP/flutter/bin:$PATH"
          echo "flutter.sdk=$RUNNER_TEMP/flutter" > android/local.properties
          flutter pub get
          dart run tooling/watch_fixtures.dart
          mkdir -p android/wear/src/androidTest/assets
          cp build/watch-fixtures.json android/wear/src/androidTest/assets/
          cp assets/logos/albert_heijn.png android/wear/src/androidTest/assets/
          cd android
          gradle :wear:assembleDebug :wear:assembleDebugAndroidTest :wear:testDebugUnitTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: android-wear
          arch: ${{ matrix.arch }}
          profile: wearos_small_round
          disable-animations: true
          script: |
            adb install build/wear/outputs/apk/debug/wear-debug.apk
            adb install build/wear/outputs/apk/androidTest/debug/wear-debug-androidTest.apk
            adb shell am instrument -w nl.paskluis.app.test/nl.paskluis.watch.StorePreview | tee wear-preview.log
            mkdir -p store-preview
            for screen in passes scroll qr barcode swiped-code settings qr-list gift-list gift; do adb exec-out run-as nl.paskluis.app cat files/store-preview/wear-$screen.png > store-preview/wear-$screen.png || true; done
            adb logcat -d -s AndroidRuntime > wear-crash.log
            grep -q 'checks passed' wear-preview.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wear-store-preview-${{ matrix.api }}
          path: |
            store-preview/*.png
            wear-preview.log
            wear-crash.log
