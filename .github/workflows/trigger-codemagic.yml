name: Start Codemagic build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Git branch to build
        required: true
        default: codex/search-and-premium-build-25
  push:
    branches:
      - codex/search-and-premium-build-25
    paths-ignore:
      - .github/workflows/trigger-codemagic.yml

permissions:
  contents: read

jobs:
  start-codemagic:
    name: Start ${{ matrix.platform }} in Codemagic
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            workflow: ios-release
          - platform: Android
            workflow: android-test
    steps:
      - name: Start build through Codemagic API
        env:
          CODEMAGIC_API_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
          REQUESTED_BRANCH: ${{ inputs.branch || github.ref_name }}
          REQUESTED_WORKFLOW: ${{ matrix.workflow }}
          REQUESTED_PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${CODEMAGIC_API_TOKEN:-}" ]; then
            echo "GitHub secret CODEMAGIC_API_TOKEN is missing."
            exit 1
          fi

          apps_json="$(curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            -H "x-auth-token: ${CODEMAGIC_API_TOKEN}" \
            https://api.codemagic.io/apps)"

          app_id="$(jq -r '
            .applications[]
            | select((.appName // "" | ascii_downcase) == "paskluis")
            | ._id
          ' <<<"${apps_json}" | head -n 1)"

          if [ -z "${app_id}" ] || [ "${app_id}" = "null" ]; then
            echo "Codemagic application 'paskluis' was not found."
            exit 1
          fi

          payload="$(jq -n \
            --arg app_id "${app_id}" \
            --arg workflow_id "${REQUESTED_WORKFLOW}" \
            --arg branch "${REQUESTED_BRANCH}" \
            '{appId: $app_id, workflowId: $workflow_id, branch: $branch}')"

          response="$(curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            -H "x-auth-token: ${CODEMAGIC_API_TOKEN}" \
            --data "${payload}" \
            --request POST \
            https://api.codemagic.io/builds)"

          build_id="$(jq -r '.buildId // empty' <<<"${response}")"
          if [ -z "${build_id}" ]; then
            echo "Codemagic did not return a build ID."
            exit 1
          fi

          echo "${REQUESTED_PLATFORM} build started successfully: ${build_id}"
