name: Validate PasKluis release
on:
  push:
    branches: ['codex/**', main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Install locked admin test dependencies
        run: npm ci --prefix admin --ignore-scripts
      - name: Verify notification delivery and purchase reconciliation
        run: node --test supabase/tests/*_test.mjs admin/tests/*_test.mjs
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter from the official repository
        run: |
          git clone --depth 1 --branch 3.47.6 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies and translations
        run: |
          flutter --version
          flutter pub get
          flutter gen-l10n
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Regression tests
        run: flutter test --reporter expanded
      - name: Verify offsite backup safeguards
        run: python3 -m unittest discover -s ops -v
