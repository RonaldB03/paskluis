name: Promote Belgium store release

on:
  push:
    branches: [codex/belgium-production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: belgium-production
  cancel-in-progress: false

jobs:
  test-build:
    if: github.ref_name == 'codex/belgium-production'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        workflow: [store-inspect-194]
    steps:
      - name: Start and monitor the test build
        env:
          CODEMAGIC_API_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
          BUILD_BRANCH: ${{ github.ref_name }}
          BUILD_WORKFLOW: ${{ matrix.workflow }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Looking up the Codemagic app"
          apps=$(curl --fail-with-body --silent --show-error --max-time 45 -H "x-auth-token: $CODEMAGIC_API_TOKEN" https://api.codemagic.io/apps)
          app_id=$(jq -er '[.applications[] | select((.appName | ascii_downcase) == "paskluis")] | if length == 1 then .[0]._id else error("Expected one PasKluis app") end' <<< "$apps")
          payload=$(jq -n --arg app "$app_id" --arg branch "$BUILD_BRANCH" --arg workflow "$BUILD_WORKFLOW" '{appId:$app,branch:$branch,workflowId:$workflow}')
          echo "Requesting the test build"
          response=$(curl --fail-with-body --silent --show-error --max-time 45 -H 'Content-Type: application/json' -H "x-auth-token: $CODEMAGIC_API_TOKEN" --data "$payload" https://api.codemagic.io/builds) || { echo "$response" | jq -c '.message // .error // "Codemagic rejected the request"'; exit 1; }
          build_id=$(jq -er .buildId <<< "$response")
          link="https://codemagic.io/app/$app_id/build/$build_id"
          echo "$link" | tee -a "$GITHUB_STEP_SUMMARY"
          for attempt in $(seq 1 120); do
            response=$(curl --fail --silent --show-error --retry 3 --max-time 45 -H "x-auth-token: $CODEMAGIC_API_TOKEN" "https://codemagic.io/api/v3/builds/$build_id")
            status=$(jq -er .data.status <<< "$response")
            echo "$status"
            case "$status" in
              finished) exit 0 ;;
              failed|canceled|cancelled|timeout) exit 1 ;;
            esac
            sleep 30
          done
          exit 1
